name: Verify Release Assets

# 发布资产完整性双保险：release.yml 的 verify-assets 在发布前校验本地产物，
# 本工作流在 release: published 后下载真实产物做独立端到端复查（配对 + 字节哈希 + 正文哈希）。
# 只读权限，不干扰现有 release/build 流程（issue: 0.34.1 sha256 资产曾残缺 29B）。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要校验的 release tag（如 v0.34.1）
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: verify-release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify installer + sha256 assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify published assets end-to-end
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "Cross-checking published release assets for tag: $TAG"
          echo "(independent post-publish check: download installer, verify bytes against .sha256 and release body)"
          node .github/scripts/verify-release-assets.mjs --tag "$TAG"
