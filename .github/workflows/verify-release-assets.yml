name: Verify Release Assets

# 发布资产完整性双保险：release.yml 的 verify-assets 在发布前校验本地产物，
# 本工作流在 release: published 后下载真实产物做独立端到端复查（配对 + 字节哈希 + 正文哈希）。
# 校验失败时写 job summary 并自动开 issue 告警，避免只在 CI 里红而没人看见。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要校验的 release tag（如 v0.34.1）
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify installer + sha256 assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify published assets end-to-end
        id: verify
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "Cross-checking published release assets for tag: $TAG"
          echo "(independent post-publish check: download installer, verify bytes against .sha256 and release body)"
          node .github/scripts/verify-release-assets.mjs --tag "$TAG"

      - name: Report result and alert on failure
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = success ]; then
            {
              echo '## 发布资产校验通过'
              echo
              echo "tag: $TAG"
              echo
              echo '发布后端到端复查通过：安装包与 .sha256 配对正确，字节哈希与 release 正文一致。'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo '## 发布资产校验失败'
            echo
            echo "tag: $TAG"
            echo
            echo '发布后端到端复查未通过，详情见 job 日志。'
          } >> "$GITHUB_STEP_SUMMARY"

          TITLE="[release-asset-gate] $TAG 发布资产校验失败"
          EXISTING="$(gh api "repos/${GH_REPO}/issues?state=open&per_page=100" --jq "[.[] | select(.title == \"$TITLE\") | .number][0] // empty")"
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "发布后资产端到端校验失败。
          
          tag: $TAG
          run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          请检查安装包、.sha256 资产与 release 正文哈希是否一致。"
          else
            echo "已存在告警 issue #$EXISTING，跳过重复创建"
          fi
          exit 1
